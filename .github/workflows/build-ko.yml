name: Build rtl8812au Kernel Module (GKI 5.15 Android13)

on:
  workflow_dispatch:
    # Optional inputs for flexibility, but defaults are set to the required target
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., android13-5.15)'
        required: false
        default: 'android13-5.15'
      os_patch_level:
        description: 'OS patch level (e.g., 2025-12)'
        required: false
        default: '2025-12'

jobs:
  build-module:
    runs-on: ubuntu-latest
    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo flex bison build-essential libssl-dev gcc-aarch64-linux-gnu

      - name: Initialize and sync kernel repository
        id: sync_kernel
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ github.event.inputs.kernel_version }}
          OS_PATCH_LEVEL: ${{ github.event.inputs.os_patch_level }}
        run: |
          set -euo pipefail
          mkdir -p kernel
          cd kernel

          ANDROID_PART="${VERSION%-*}"
          KERNEL_PART="${VERSION#*-}"
          FORMATTED_BRANCH="${ANDROID_PART}-${KERNEL_PART}-${OS_PATCH_LEVEL}"
          echo "目标分支: common-${FORMATTED_BRANCH}"

          init_repo() {
            repo init -u https://android.googlesource.com/kernel/manifest \
              -b common-${FORMATTED_BRANCH} --depth=1 || return 1
            REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common \
              ${FORMATTED_BRANCH} 2>/dev/null || true)
            if [[ -n "$REMOTE_BRANCH" ]] && grep -q deprecated <<< "$REMOTE_BRANCH"; then
              sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" \
                .repo/manifests/default.xml
              echo "⚠️  分支 common-${FORMATTED_BRANCH} 已弃用，使用 deprecated/ 路径"
            fi
            return 0
          }

          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "尝试 $attempt/$MAX_RETRIES 初始化 repo..."
            if init_repo; then
              echo "repo init 成功，开始同步..."
              if timeout 15m repo sync -c --current-branch --no-clone-bundle --no-tags \
                --jobs-checkout=4 -j4; then
                echo "内核源码同步完成"
                break
              else
                echo "repo sync 失败"
              fi
            else
              echo "repo init 失败"
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "清理并重试..."
              rm -rf .repo
              sleep 15
            else
              echo "所有重试均失败" >&2
              exit 1
            fi
          done

          cd common
          if [ -d .git ]; then
            echo "KERNEL_COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "KERNEL_COMMIT_DATE=$(git log -1 --format=%cI)" >> $GITHUB_ENV
            echo "KERNEL_COMMIT_MSG=$(git log -1 --format=%s)" >> $GITHUB_ENV
          fi

      - name: Checkout rtl8812au driver (lwfinger/rtw88)
        uses: actions/checkout@v4
        with:
          repository: lwfinger/rtw88
          path: rtw88
          ref: master

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y clang lld llvm make

      - name: Compile rtl8812au kernel module
        run: |
          # Use the same toolchain and output directory as the kernel build
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export KERNEL_DIR=${{ github.workspace }}/kernel/common
          export OUT_DIR=/home/runner/out   # matches build-kernel action

          # Build external modules (rtw88 will build all supported modules)
          make -C $KERNEL_DIR O=$OUT_DIR M=${{ github.workspace }}/rtw88 modules
        shell: bash

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-modules
          path: rtw88/*.ko
