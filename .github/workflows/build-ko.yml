name: Build rtl8812au Kernel Module (Using config.gz)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., android13-5.15)'
        required: false
        default: 'android13-5.15'
      os_patch_level:
        description: 'OS patch level (e.g., 2025-12)'
        required: false
        default: '2025-12'
      sublevel:
        description: 'Kernel sublevel (e.g., 194)'
        required: false
        default: '194'

jobs:
  build-module:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo flex bison build-essential libssl-dev \
            gcc-aarch64-linux-gnu clang lld llvm make wget unzip

      # 下载内核源码（复用 WildKernels 的 download-kernel Action）
      - name: Checkout WildKernels repository (for actions)
        uses: actions/checkout@v4
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          path: wildkernels
          ref: 8863e4e04ee554e50b431031375bf8ed475eec9a

      - name: Create kernel directory
        run: mkdir -p ${{ github.workspace }}/kernel

      - name: Download Kernel Source
        uses: ./wildkernels/.github/actions/download-kernel
        with:
          version: ${{ github.event.inputs.kernel_version }}
          android_version: ${{ github.event.inputs.kernel_version }}
          kernel_version: ${{ github.event.inputs.kernel_version }}
          os_patch_level: ${{ github.event.inputs.os_patch_level }}

      - name: Setup Build Environment
        uses: ./wildkernels/.github/actions/setup-build-environment
        with:
          version: ${{ github.event.inputs.kernel_version }}
          sublevel: ${{ github.event.inputs.sublevel }}

      # 编译 rtl8812au
      - name: Checkout rtl8812au driver
        uses: actions/checkout@v4
        with:
          repository: jiajianet/rtw88
          path: rtw88
          ref: master
          
      - name: List files in workspace
        run: ls -la ${{ github.workspace }}/rtw88
        
      - name: Extract config from repository
        working-directory: ${{ github.workspace }}/kernel
        run: |
          gunzip -c ${{ github.workspace }}/rtw88/config.gz > .config
          mkdir -p out
          cp .config out/.config
    
      # 准备模块编译
      - name: Prepare for external module build
        working-directory: ${{ github.workspace }}/kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export OUT_DIR=${{ github.workspace }}/kernel/out

          make O=$OUT_DIR ARCH=arm64 LLVM=1 olddefconfig
          make O=$OUT_DIR ARCH=arm64 LLVM=1 modules_prepare



      - name: Compile module
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export KERNEL_DIR=${{ github.workspace }}/kernel
          export OUT_DIR=${{ github.workspace }}/kernel/out

          make -C $KERNEL_DIR O=$OUT_DIR M=${{ github.workspace }}/rtw88 modules

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-modules
          path: rtw88/*.ko
