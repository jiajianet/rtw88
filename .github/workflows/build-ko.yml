name: Build rtl8812au Kernel Module (WildKernels Config)

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version (e.g., android13-5.15)'
        required: false
        default: 'android13-5.15'
      os_patch_level:
        description: 'OS patch level (e.g., 2025-12)'
        required: false
        default: '2025-12'

jobs:
  build-module:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y repo flex bison build-essential libssl-dev \
            gcc-aarch64-linux-gnu clang lld llvm make wget unzip \
            ccache # WildKernels 构建环境依赖 ccache

      - name: Checkout WildKernels repository (for build scripts)
        uses: actions/checkout@v4
        with:
          repository: WildKernels/GKI_KernelSU_SUSFS
          path: wildkernels
          ref: 8863e4e04ee554e50b431031375bf8ed475eec9a

      # --- 1. 下载并准备内核源码（复用 WildKernels 的 download-kernel action）---
      - name: Download Kernel Source
        uses: ./wildkernels/.github/actions/download-kernel
        with:
          version: ${{ github.event.inputs.kernel_version }}
          android_version: ${{ github.event.inputs.kernel_version }}
          kernel_version: ${{ github.event.inputs.kernel_version }}
          os_patch_level: ${{ github.event.inputs.os_patch_level }}

      # --- 2. 设置构建环境（复用 WildKernels 的 setup-build-environment action）---
      - name: Setup Build Environment
        uses: ./wildkernels/.github/actions/setup-build-environment
        with:
          version: ${{ github.event.inputs.kernel_version }}
          sublevel: '194' # 根据你的内核版本调整，例如 5.15.194 中的 194

      # --- 3. 生成内核配置（复用 WildKernels 的 build-kernel action）---
      # 这一步会执行 build/build.sh 或 Bazel，生成完整的 .config 文件
      - name: Generate Kernel Config
        uses: ./wildkernels/.github/actions/build-kernel
        with:
          version: ${{ github.event.inputs.kernel_version }}
          bypass: 'false' # 根据 WildKernels 的输入参数决定，通常为 false

      # --- 4. 准备外部模块编译环境 ---
      - name: Prepare for external module build
        working-directory: ${{ github.workspace }}/kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export OUT_DIR=${{ github.workspace }}/kernel/out

          # 确保 .config 存在（由 build-kernel 生成）
          # 清理并准备模块编译
          make O=$OUT_DIR ARCH=arm64 LLVM=1 olddefconfig
          make O=$OUT_DIR ARCH=arm64 LLVM=1 modules_prepare

      # --- 5. 编译 rtl8812au 外部模块 ---
      - name: Checkout rtl8812au driver (lwfinger/rtw88)
        uses: actions/checkout@v4
        with:
          repository: lwfinger/rtw88
          path: rtw88
          ref: master

      - name: Compile rtl8812au kernel module
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export KERNEL_DIR=${{ github.workspace }}/kernel
          export OUT_DIR=${{ github.workspace }}/kernel/out

          make -C $KERNEL_DIR O=$OUT_DIR M=${{ github.workspace }}/rtw88 modules

      - name: Upload compiled modules
        uses: actions/upload-artifact@v4
        with:
          name: rtl8812au-modules
          path: rtw88/*.ko
